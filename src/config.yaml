# Metadata
solution:
  name: "Object Detection Solution"
  description: "A solution for object detection tasks."
  # docker_image: "supervisely/base-py-sdk:6.73.398"
  # instance_version: "6.13.8"
  # version: "1.0.0"

# Graph settings
settings:
  environment:
    variables:
      PROJECT_ID: "{{ $PROJECT_ID | default('null') }}"
  graph:
    height: "1800px"
    width: "100%"
    grid: true
  positions: &positions
    auto_import: &auto_import_position { x: 770, y: 30 }
    cloud_import: &cloud_import_position { x: 430, y: 30 }
    input_project: &input_project_position { x: 620, y: 150 }
    open_ai_clip: &open_ai_clip_position { x: 150, y: 270 }
    ai_index: &ai_index_position { x: 380, y: 270 }
    smart_sampling: &smart_sampling_position { x: 612, y: 340 }
    labeling_project: &labeling_project_position { x: 620, y: 470 }
    labeling_queue: &labeling_queue_position { x: 612, y: 660 }
    labeling_queue_performance:
      &labeling_queue_performance_position { x: 950, y: 660 }
    move_labeled_data: &move_labeled_data_position { x: 612, y: 950 }
    train_val_split: &train_val_split_position { x: 612, y: 1040 }
    training_project: &training_project_position { x: 600, y: 1140 }
    training_project_stats: &training_project_stats_position { x: 950, y: 1140 }
    all_experiments: &all_experiments_position { x: 1200, y: 1340 }
    re_evaluate: &re_evaluate_position { x: 1300, y: 1540 }
    evaluation_report: &evaluation_report_position { x: 1500, y: 1640 }
    compare_models: &compare_models_position { x: 1334, y: 1840 }
    comparison_report: &comparison_report_position { x: 1500, y: 1940 }
    email_notification: &email_notification_position { x: 1500, y: 2040 }
    deploy_pretrained_model:
      &deploy_pretrained_model_position { x: 1150, y: 425 }
    pre_labeling: &pre_labeling_position { x: 850, y: 425 }
  defaults: &defaults
    width: 250
    connection_settings: &defaults_connection_settings
      type: "smoothstep"

# All nodes in the graph
nodes:
  # - id: "state_initialization"
  #   # placeholder for future state initialization node

  - id: &auto_import_id "auto_import" # unique ID for the node
    name: &auto_import_name "Manual D&D Import"
    description: &auto_import_description "Each import creates a dataset folder in the Input Project, centralising all incoming data and easily managing it over time. Automatically detects 10+ annotation formats."
    type: "supervisely.solution.AutoImportNode" # type of the node to import
    parameters:
      title: *auto_import_name
      description: *auto_import_description
      project_id: "{{ $PROJECT_ID | default('null') }}"
      # tooltip_position: "right"
      <<: *auto_import_position # x, y
      icon: "mdi mdi-arrow-down-bold-circle"
      icon_color: "#1976D2"
      icon_bg_color: "#E3F2FD"

  - id: &cloud_import_id "cloud_import" # unique ID for the node
    name: &cloud_import_name "Import from Cloud"
    description: &cloud_import_description "Each import creates a dataset folder in the Input Project, centralising all incoming data and easily managing it over time. Automatically detects 10+ annotation formats."
    type: "supervisely.solution.CloudImportNode" # type of the node to import
    parameters:
      title: *cloud_import_name
      description: *cloud_import_description
      project_id: "{{ $PROJECT_ID | default('null') }}"
      <<: *cloud_import_position # x, y
      icon: "mdi mdi-cloud-download"
      icon_color: "#1976D2"
      icon_bg_color: "#E3F2FD"

  - id: &input_project_id "input_project"
    name: &input_project_name "Input Project"
    description: &input_project_description "The Input Project is the central hub for all incoming data. Data in this project will not be modified."
    type: "supervisely.solution.InputProjectNode"
    parameters:
      title: *input_project_name
      description: *input_project_description
      project_id: "{{ $PROJECT_ID | default('null') }}"
      tooltip_position: "right"
      <<: *input_project_position # x, y

  - id: &open_ai_clip_id "open_ai_clip"
    name: &open_ai_clip_name "OpenAI CLIP"
    description: &open_ai_clip_description "OpenAI CLIP is a powerful model that can be used to generate embeddings for images in your project. These embeddings can be used for various tasks, such as image similarity search, prompt-based image retrieval. In this application, it is used to create an index and search images based on text prompts or clusters."
    type: "supervisely.solution.OpenAIClipServiceNode"
    parameters:
      <<: *open_ai_clip_position # x, y
      icon: "mdi mdi-apps"
      icon_color: "#4CAF50"
      icon_bg_color: "#E8F5E9"

  - id: &ai_index_id "ai_index"
    name: &ai_index_name "AI Index"
    description: &ai_index_description "AI Search Index is a powerful tool that allows you to search for images in your dataset using AI models. It provides a quick and efficient way to find similar images based on visual features. You can use it in Smart Sampling node to select images for labeling based on specified prompt."
    type: "supervisely.solution.AiIndexNode"
    parameters:
      <<: *ai_index_position # x, y
      project_id: "{{ $PROJECT_ID | default('null') }}"
      icon: "mdi mdi-image-search"
      icon_color: "#4CAF50"
      icon_bg_color: "#E8F5E9"

  - id: &smart_sampling_id "smart_sampling"
    name: "Smart Sampling"
    description: "Selects a data sample from the input project and copies it to the labeling project. Supports various sampling strategies: random, k-means clustering, diversity-based, or using embeddings precomputed by the “AI Index” node for smarter selection."
    type: "supervisely.solution.SmartSamplingNode"
    parameters:
      project_id: "{{ $PROJECT_ID | default('null') }}"
      dst_project: "{{ $LABELING_PROJECT_ID | default('null') }}"
      <<: *smart_sampling_position # x, y

  - id: &labeling_project_id "labeling_project"
    name: &labeling_project_name "Labeling Project"
    description: &labeling_project_description "Project specifically for labeling data. All data in this project is in the labeling process. After labeling, data will be moved to the Training Project."
    type: "supervisely.solution.LabelingProjectNode"
    parameters:
      title: *labeling_project_name
      description: *labeling_project_description
      project_id: "{{ $LABELING_PROJECT_ID | default('null') }}"
      <<: *labeling_project_position

  - id: &labeling_queue_id "labeling_queue"
    name: "Labeling Queue"
    description: "Labeling Queue management. Labeling queue is a full annotation workflow where annotators pick the next available image from a shared queue. Once labeled, images are sent for review and quality check. Rejected images return to the same annotator."
    type: "supervisely.solution.LabelingQueueNode"
    parameters:
      <<: *labeling_queue_position
      queue_id: "{{ $LABELING_QUEUE_ID | default('null') }}"
      collection_id: "{{ $LABELING_COLLECTION_ID | default('null') }}"

  - id: &labeling_queue_performance_id "labeling_queue_performance"
    name: &labeling_queue_performance_title "Labeling Performance"
    description: &labeling_queue_performance_description "Labeling Queue performance metrics. This node tracks the performance of labeling jobs in the Labeling Queue. It provides real-time statistics on the number of images being labeled, reviewed, and approved."
    type: "supervisely.solution.LabelingQueuePerformanceNode"
    parameters:
      <<: *labeling_queue_performance_position
      title: *labeling_queue_performance_title
      description: *labeling_queue_performance_description
      queue_id: "{{ $LABELING_QUEUE_ID | default('null') }}"
      icon: "mdi mdi-chart-bar"
      icon_color: "#1976D2"
      icon_bg_color: "#E3F2FD"


  - id: &train_val_split_id "train_val_split"
    name: "Train/Val Split"
    description: "Split dataset into Train and Validation sets for model training. Datasets structure mirrors the Input Project with splits organized in corresponding Collections (e.g., 'train_1', 'val_1', etc.)."
    type: "supervisely.solution.TrainValSplitNode"
    parameters:
      dst_project_id: "{{ $TRAINING_PROJECT_ID | default('null') }}"
      <<: *train_val_split_position
      icon: "mdi mdi-set-split"

  - id: &move_labeled_data_id "move_labeled_data"
    name: "Move Labeled Data"
    description: "Move labeled and accepted images to the Training Project."
    type: "supervisely.solution.MoveLabeledNode"
    parameters:
      src_project_id: "{{ $LABELING_PROJECT_ID | default('null') }}"
      dst_project_id: "{{ $TRAINING_PROJECT_ID | default('null') }}"
      <<: *move_labeled_data_position
      icon: "mdi mdi-folder-move"

  - id: &training_project_id "training_project"
    name: &training_project_name "Training Project"
    description: &training_project_description "Project specifically for training data. All data in this project is in the training process. After training, data will be moved to the Training Project."
    type: "supervisely.solution.TrainingProjectNode"
    parameters:
      # is_training: true
      title: *training_project_name
      description: *training_project_description
      project_id: "{{ $TRAINING_PROJECT_ID | default('null') }}"
      <<: *training_project_position

  - id: &training_project_stats_id "training_project_stats"
    name: &training_project_stats_name "QA & Stats"
    description: &training_project_stats_description "Open the QA & Stats page to explore detailed insights into the training project.."
    type: "supervisely.solution.QAStatsNode"
    parameters:
      title: *training_project_stats_name
      description: *training_project_stats_description
      <<: *training_project_stats_position
      project_id: "{{ $TRAINING_PROJECT_ID | default('null') }}"
      icon: "mdi mdi-chart-bar"
      link: "/projects/{{ $TRAINING_PROJECT_ID | default('null') }}/stats/datasets"

  - id: &all_experiments "all_experiments"
    name: &all_experiments_name "All Experiments"
    description: &all_experiments_description "Track all experiments in one place. The best model for comparison will be selected from the list of experiments based on the primary metric (mAP for detection, IoU for semantic segmentation)."
    type: "supervisely.solution.AllExperimentsNode"
    parameters:
      title: *all_experiments_name
      description: *all_experiments_description
      <<: *all_experiments_position
      # project_id: "{{ $TRAINING_PROJECT_ID | default('null') }}"
      icon: "mdi mdi-flask-outline"
      icon_color: "#1976D2"
      icon_bg_color: "#E3F2FD"
      tooltip_position: "right"

  - id: &re_evaluate "re_evaluate"
    name: &re_evaluate_name "Re-evaluate on new validation dataset"
    description: &re_evaluate_description "Re-evaluate the best model on a new validation dataset."
    type: "supervisely.solution.EvaluationNode"
    parameters:
      title: *re_evaluate_name
      description: *re_evaluate_description
      <<: *re_evaluate_position
      # project_id: "{{ $TRAINING_PROJECT_ID | default('null') }}"
      icon: "mdi mdi-chart-box"
      icon_color: "#1976D2"
      icon_bg_color: "#E3F2FD"
      tooltip_position: "right"

  - id: &evaluation_report "evaluation_report"
    name: &evaluation_report_name "Evaluation Report"
    description: &evaluation_report_description "View the evaluation report of the model."
    type: "supervisely.solution.EvaluationReportNode"
    parameters:
      title: *evaluation_report_name
      description: *evaluation_report_description
      <<: *evaluation_report_position
      icon: "mdi mdi-file-chart-check"

  - id: &compare_models "compare_models"
    name: &compare_models_name "Compare Models"
    description: &compare_models_description "Compare evaluation results from the latest training session against the best model reference report. Helps track performance improvements over time and identify the most effective training setups. If the new model performs better, it can be used to re-deploy the NN model for pre-labeling to speed-up the process."
    type: "supervisely.solution.CompareModelsNode"
    parameters:
      title: *compare_models_name
      project_id: "{{ $TRAINING_PROJECT_ID | default('null') }}"
      description: *compare_models_description
      <<: *compare_models_position
      icon: "mdi mdi-compare"

  - id: &comparison_report "comparison_report"
    name: &comparison_report_name "Comparison Report"
    description: &comparison_report_description "View the comparison report of the models."
    type: "supervisely.solution.EvaluationReportNode"
    parameters:
      title: *comparison_report_name
      description: *comparison_report_description
      <<: *comparison_report_position
      icon: "mdi mdi-file-chart-check"

  - id: &email_notification "email_notification"
    name: &email_notification_name "Email Notification"
    description: &email_notification_description "Automatically send email notifications after each model comparison. You can configure the recipients and subject of the email."
    type: "supervisely.solution.EmailNotificationNode"
    parameters:
      title: *email_notification_name
      description: *email_notification_description
      <<: *email_notification_position
      icon: "mdi mdi-email"

  - id: &deploy_pretrained_model_id "deploy_pretrained_model"
    name: &deploy_pretrained_model_name "Deploy Pretrained Model"
    description: &deploy_pretrained_model_description "Deploy a pretrained model for pre-labeling to speed up the labeling process."
    type: "supervisely.solution.DeployPretrainedModelNode"
    parameters:
      title: *deploy_pretrained_model_name
      description: *deploy_pretrained_model_description
      <<: *deploy_pretrained_model_position
      icon: "mdi mdi-rocket-launch"
      icon_color: "#4CAF50"
      icon_bg_color: "#E8F5E9"

  - id: &pre_labeling_id "pre_labeling"
    name: &pre_labeling_name "Pre-labeling"
    description: &pre_labeling_description "Automatically generate predictions for images using the deployed custom model."
    type: "supervisely.solution.PreLabelingNode"
    parameters:
      title: *pre_labeling_name
      description: *pre_labeling_description
      <<: *pre_labeling_position # x, y

connections:
  - id: "edge-auto_import-to-input_project"
    source: *auto_import_id
    target: *input_project_id
    <<: *defaults_connection_settings

  - id: "edge-cloud_import-to-input_project"
    source: *cloud_import_id
    target: *input_project_id
    <<: *defaults_connection_settings

  - id: "edge-input_project-to-ai_index"
    source: *input_project_id
    target: *ai_index_id
    <<: *defaults_connection_settings
    style:
      strokeDasharray: "8,8"

  - id: "edge-open_ai_clip-to-ai_index"
    source: *open_ai_clip_id
    target: *ai_index_id
    <<: *defaults_connection_settings
    style:
      # stroke: "#B1B1B6"
      # strokeWidth: 1
      strokeDasharray: "8,8"

  - id: "edge-ai_index-to-smart_sampling"
    source: *ai_index_id
    target: *smart_sampling_id
    <<: *defaults_connection_settings
    style:
      strokeDasharray: "8,8"

  - id: "edge-input_project-to-smart_sampling"
    source: *input_project_id
    target: *smart_sampling_id
    <<: *defaults_connection_settings

  - id: "edge-smart_sampling-to-labeling_project"
    source: *smart_sampling_id
    target: *labeling_project_id
    <<: *defaults_connection_settings

  - id: "edge-labeling_project-to-labeling_queue"
    source: *labeling_project_id
    target: *labeling_queue_id
    <<: *defaults_connection_settings

  - id: "edge-labeling_queue-to-labeling_queue_performance"
    source: *labeling_queue_id
    target: *labeling_queue_performance_id
    <<: *defaults_connection_settings
    style:
      strokeDasharray: "8,8"

  - id: "edge-labeling_queue-to-move_labeled_data"
    source: *labeling_queue_id
    target: *move_labeled_data_id
    <<: *defaults_connection_settings

  - id: "edge-labeling_queue-to-train_val_split"
    source: *labeling_queue_id
    target: *train_val_split_id
    <<: *defaults_connection_settings

  - id: "edge-move_labeled_data-to-train_val_split"
    source: *move_labeled_data_id
    target: *train_val_split_id
    <<: *defaults_connection_settings

  - id: "edge-train_val_split-to-training_project"
    source: *train_val_split_id
    target: *training_project_id
    <<: *defaults_connection_settings

  - id: "edge-training_project-to-training_project_stats"
    source: *training_project_id
    target: *training_project_stats_id
    <<: *defaults_connection_settings
    style:
      strokeDasharray: "8,8"

  - id: "edge-all_experiments-to-re_evaluate"
    source: *all_experiments
    target: *re_evaluate
    <<: *defaults_connection_settings

  - id: "edge-re_evaluate-to-evaluation_report"
    source: *re_evaluate
    target: *evaluation_report
    <<: *defaults_connection_settings

  - id: "edge-re_evaluate-to-compare_models"
    source: *re_evaluate
    target: *compare_models
    <<: *defaults_connection_settings

  - id: "edge-compare_models-to-comparison_report"
    source: *compare_models
    target: *comparison_report
    <<: *defaults_connection_settings

  - id: "edge-compare_models-to-email_notification"
    source: *compare_models
    target: *email_notification
    <<: *defaults_connection_settings

  - id: "edge-deploy_pretrained_model-to-pre_labeling"
    source: *deploy_pretrained_model_id
    target: *pre_labeling_id
    <<: *defaults_connection_settings

  - id: "edge-smart_sampling-to-pre_labeling"
    source: *smart_sampling_id
    target: *pre_labeling_id
    <<: *defaults_connection_settings

  - id: "edge-pre_labeling-to-labeling_project"
    source: *pre_labeling_id
    target: *labeling_project_id
    <<: *defaults_connection_settings
